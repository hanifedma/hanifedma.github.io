<!DOCTYPE html>
<!-- Served by GitHub Pages for any unknown path, at any depth, so every link and asset
     reference here is absolute. "preload" holds transitions until the first paint. -->
<html lang="en" class="preload" data-lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="description" content="Page not found.">
    <meta name="theme-color" content="#0f0f0f">
    <title>Page not found — Hanif Edma</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="manifest" href="/favicon/site.webmanifest">

    <!-- Match whatever theme and language the visitor was already using, before first paint. -->
    <script>
        var meta404 = {
            en: { title: 'Page not found — Hanif Edma' },
            ko: { title: '페이지를 찾을 수 없습니다 — Hanif Edma' }
        };
        try {
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff');
            }
        } catch (e) { /* localStorage may be unavailable; default theme is fine */ }
        (function () {
            var lang = 'en';
            try {
                var asked = new URLSearchParams(location.search).get('lang');
                var saved = localStorage.getItem('lang');
                if (asked === 'ko' || asked === 'en') lang = asked;
                else if (saved === 'ko' || saved === 'en') lang = saved;
            } catch (e) { /* no URLSearchParams/localStorage — English it is */ }
            var root = document.documentElement;
            root.setAttribute('data-lang', lang);
            root.setAttribute('lang', lang);
            document.title = meta404[lang].title;
        })();
    </script>

    <style>
        :root {
            --bg: #0f0f0f;
            --text-primary: #f0f0f0;
            --text-secondary: #e0e0e0;
            --accent: #3b82f6;
            --border: #333333;
            --card-bg: #1a1a1a;
            --font-main: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        [data-theme="light"] {
            --bg: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #404040;
            --accent: #2563eb;
            --border: #e5e7eb;
            --card-bg: #f3f4f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        a,
        .code,
        .btn {
            transition: background-color 2s, color 2s, border-color 2s;
        }

        .preload * {
            transition: none !important;
        }

        html[data-lang="en"] .t-ko,
        html[data-lang="ko"] .t-en {
            display: none;
        }

        html[data-lang="ko"] body {
            line-height: 1.7;
            word-break: keep-all;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Language switch, top-right, same as the rest of the site. */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            padding: 1.5rem 1.5rem 0;
        }

        /* One button showing the language you are reading: EN in English, 한 in
           Korean. Its label is the same bilingual markup as the rest of the page,
           so it flips with everything else and needs no script of its own. The
           fixed width keeps the row from shifting as the label changes. */
        .lang-toggle {
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            line-height: 1;
            min-width: 2.6rem;
            padding: 0.5rem 0.6rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--card-bg);
            color: var(--text-secondary);
            cursor: pointer;
            transition: background-color 0.18s, color 0.18s, border-color 0.18s;
        }

        .lang-toggle:hover {
            color: var(--text-primary);
            border-color: var(--accent);
        }

        .lang-toggle:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1.5rem 4rem;
        }

        .code {
            font-size: clamp(5rem, 22vw, 10rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.03em;
            color: var(--accent);
        }

        h1 {
            margin-top: 1.25rem;
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        p {
            margin-top: 0.75rem;
            font-size: 1.0625rem;
            color: var(--text-secondary);
            max-width: 30rem;
        }

        .actions {
            margin-top: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
        }

        .btn {
            font-size: 0.95rem;
            font-weight: 500;
            padding: 0.6rem 1.2rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
        }

        .btn:hover {
            transition: border-color 0.15s, color 0.15s;
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }

        .btn.primary:hover {
            color: #ffffff;
            filter: brightness(1.08);
        }

        a {
            color: inherit;
        }
    </style>
</head>

<body>
    <div class="top-bar">
        <button type="button" class="lang-toggle" data-toggle-lang>
            <span class="t-en" lang="en">EN</span><span class="t-ko" lang="ko">한</span>
        </button>
    </div>

    <main>
        <div class="code">404</div>
        <h1>
            <span class="t-en" lang="en">Page not found</span>
            <span class="t-ko" lang="ko">페이지를 찾을 수 없습니다</span>
        </h1>
        <p>
            <span class="t-en" lang="en">The page you're looking for doesn't exist, or it may have moved.</span>
            <span class="t-ko" lang="ko">찾으시는 페이지가 없거나, 위치가 바뀌었을 수 있습니다.</span>
        </p>
        <div class="actions">
            <a class="btn primary" href="/">
                <span class="t-en" lang="en">&larr; Back home</span>
                <span class="t-ko" lang="ko">&larr; 홈으로</span>
            </a>
            <a class="btn" href="/portfolio/">
                <span class="t-en" lang="en">View portfolio</span>
                <span class="t-ko" lang="ko">포트폴리오 보기</span>
            </a>
        </div>
    </main>

    <script>
        const root = document.documentElement;
        const langToggle = document.querySelector('[data-toggle-lang]');

        function applyLang(lang) {
            root.setAttribute('data-lang', lang);
            root.setAttribute('lang', lang);
            document.title = meta404[lang].title;
            if (langToggle) {
                langToggle.setAttribute('aria-label', lang === 'ko' ? '한 — 영어로 전환' : 'EN — 한국어로 전환');
            }
        }

        applyLang(root.getAttribute('data-lang') === 'ko' ? 'ko' : 'en');

        if (langToggle) {
            langToggle.addEventListener('click', () => {
                const next = root.getAttribute('data-lang') === 'ko' ? 'en' : 'ko';
                applyLang(next);
                try {
                    localStorage.setItem('lang', next);
                } catch (e) { /* storage may be unavailable; the choice still holds for this visit */ }
            });
        }

        // Re-enable transitions once the first frame has painted.
        requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove('preload')));
    </script>
</body>

</html>
